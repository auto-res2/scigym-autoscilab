mode: full
results_dir: .research/results

data_root: data/scigym_sbml  # small / large の親。run の yaml の split で選ぶ。無ければ HuggingFace（h4duan/scigym-sbml）から取得
base_url: https://ai-gateway.vercel.sh/v1
instance_timeout: 14400  # 1 件 1 試行の上限秒。超えたら最初からやり直す
stall_timeout: 3600  # 出力が止まってからこの秒数で試行を打ち切る（ODE の C ライブラリ内で止まった件）
